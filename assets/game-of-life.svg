<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A24"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>

    <!-- Cell Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Alive Cell Gradient -->
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00FF7F"/>
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bgGrad)" stroke="#38384A" stroke-width="4"/>

  <!-- Background Grid Dots -->
  <g fill="#242432" opacity="0.6">
    <circle cx="56" cy="56" r="3"/>
    <circle cx="96" cy="56" r="3"/>
    <circle cx="136" cy="56" r="3"/>
    <circle cx="176" cy="56" r="3"/>
    <circle cx="216" cy="56" r="3"/>

    <circle cx="56" cy="96" r="3"/>
    <circle cx="216" cy="96" r="3"/>

    <circle cx="56" cy="136" r="3"/>
    <circle cx="216" cy="136" r="3"/>

    <circle cx="56" cy="176" r="3"/>
    <circle cx="216" cy="176" r="3"/>

    <circle cx="56" cy="216" r="3"/>
    <circle cx="96" cy="216" r="3"/>
    <circle cx="136" cy="216" r="3"/>
    <circle cx="176" cy="216" r="3"/>
    <circle cx="216" cy="216" r="3"/>
  </g>

  <!-- Central Conway Glider Pattern (Alive Cells) -->
  <!-- Glider layout in 3x3 grid centered in 256x256:
       Cell size: 36x36, gap: 10
       Offset X: 74, Offset Y: 74
       Col 0: 74, Col 1: 120, Col 2: 166
       Row 0: 74, Row 1: 120, Row 2: 166
       Glider cells:
       Row 0: Col 1 (120, 74)
       Row 1: Col 2 (166, 120)
       Row 2: Col 0 (74, 166), Col 1 (120, 166), Col 2 (166, 166)
  -->
  <g filter="url(#glow)">
    <!-- Row 0, Col 1 -->
    <rect x="110" y="64" width="36" height="36" rx="8" fill="url(#cellGrad)" stroke="#A7F3D0" stroke-width="2"/>

    <!-- Row 1, Col 2 -->
    <rect x="156" y="110" width="36" height="36" rx="8" fill="url(#cellGrad)" stroke="#A7F3D0" stroke-width="2"/>

    <!-- Row 2, Col 0 -->
    <rect x="64" y="156" width="36" height="36" rx="8" fill="url(#cellGrad)" stroke="#A7F3D0" stroke-width="2"/>

    <!-- Row 2, Col 1 -->
    <rect x="110" y="156" width="36" height="36" rx="8" fill="url(#cellGrad)" stroke="#A7F3D0" stroke-width="2"/>

    <!-- Row 2, Col 2 -->
    <rect x="156" y="156" width="36" height="36" rx="8" fill="url(#cellGrad)" stroke="#A7F3D0" stroke-width="2"/>
  </g>

  <!-- Dead Cell Grid Placeholders (subtle) -->
  <g fill="#1F1F2B" stroke="#2D2D3C" stroke-width="1.5">
    <!-- Row 0, Col 0 -->
    <rect x="64" y="64" width="36" height="36" rx="8" opacity="0.5"/>
    <!-- Row 0, Col 2 -->
    <rect x="156" y="64" width="36" height="36" rx="8" opacity="0.5"/>
    <!-- Row 1, Col 0 -->
    <rect x="64" y="110" width="36" height="36" rx="8" opacity="0.5"/>
    <!-- Row 1, Col 1 -->
    <rect x="110" y="110" width="36" height="36" rx="8" opacity="0.5"/>
  </g>
</svg>
